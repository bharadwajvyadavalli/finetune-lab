# Phase 3 — DPO with LoRA, starting from Phase 1 SFT adapter
# Run on g5.12xlarge (4x A10G)

base_model: mistralai/Mistral-7B-v0.1

# The SFT adapter that DPO starts from (local path after Phase 1)
sft_adapter: outputs/qlora_sft

dpo_dataset_dir: data/dpo_pairs
output_dir: outputs/dpo_lora

hub_repo: ""

quantization:
  enabled: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, v_proj]

dpo:
  beta: 0.1
  loss_type: sigmoid

training:
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  bf16: true
  logging_steps: 10
  save_steps: 200
  save_total_limit: 1
  max_length: 512
  max_prompt_length: 384
  seed: 42
