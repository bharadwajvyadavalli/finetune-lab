# Phase 1 — QLoRA SFT on Spider (10k subset for fast iteration)
# Run on g5.12xlarge (4x A10G)

base_model: mistralai/Mistral-7B-v0.1
dataset_dir: data/spider_processed
dataset_file: train_10k.jsonl
output_dir: outputs/qlora_sft

hub_repo: ""

quantization:
  enabled: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, v_proj]

training:
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  bf16: true
  logging_steps: 10
  save_steps: 200
  save_total_limit: 1
  max_seq_length: 512
  seed: 42
